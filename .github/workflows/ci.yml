name: ci

on:
  push:
  pull_request:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

# This workflow runs on GitHub-hosted x86_64 Linux runners.
# The development target is Apple Silicon with 8 GB, and the pinned runtime hash,
# benchmarks, and screenshots come from that machine.
# Anvil integration is NOT run here. Reproduce it locally with `make test-e2e`
# (and `make capture-tamper`) on a machine that has Foundry 1.8.5 installed.
# Third-party actions are pinned to commit SHAs (tag shown in the comment).

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.2"
      - name: Install locked backend dependencies
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps -e ./backend
      - name: Ruff
        run: |
          python -m ruff check backend
          python -m ruff format --check backend
      - name: Unit tests
        working-directory: backend
        run: python -m pytest tests/unit -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install, test, and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.5
      - name: Foundry tests
        working-directory: contracts
        run: |
          forge install --no-git foundry-rs/forge-std@v1.9.6
          forge test
