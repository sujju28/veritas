[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas"
version = "0.1.0"
description = "Local synthetic fraud-decision evidence prototype"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cryptography==50.0.2",
    "fastapi==0.148.0",
    "networkx==3.7",
    "pydantic==2.14.1",
    "rfc8785==0.1.4",
    "scikit-learn==1.9.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.14.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["veritas*"]

[tool.setuptools.package-data]
veritas = ["storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["veritas", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
